{% set name = "starlink-pyast" %}
{% set version = "4.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/starlink_pyast-{{ version }}.tar.gz
  sha256: a16d2e35a10a1175afca695fb503c3f5fb1db4a31b41f6e2c9df0a3c8efc733e

build:
  skip: true  # [py<312 or win]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
  host:
    - python
    - numpy
    - setuptools
    - setuptools-scm >=8.0
    - pip
  run:
    - python

test:
  source_files:
    - src/starlink/ast/test
  imports:
    - starlink
  commands:
    - pip check
    - pytest src/starlink/ast/test/test.py
  requires:
    - pip
    - pytest

about:
  home: https://pypi.org/project/starlink-pyast/
  summary: A Python wrapper for the Starlink AST library
  dev_url: https://github.com/Starlink/starlink-pyast
  license: LGPL-3.0-or-later AND BSD-3-Clause
  license_file:
    - ast/COPYING
    - ast/erfa/LICENSE

extra:
  recipe-maintainers:
    - roceb
    - timj
